name: Temporary candlestick V1 source materialization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Expand source into isolated directory
        run: |
          base64 --decode candlestick_payload.b64 > /tmp/candlestick-v1.tar.gz
          rm -rf candlestick-v1-source
          mkdir -p candlestick-v1-source
          tar -xzf /tmp/candlestick-v1.tar.gz -C candlestick-v1-source
          find candlestick-v1-source -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf candlestick-v1-source/.pytest_cache

      - name: Commit materialized source
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candlestick-v1-source
          git commit -m "Materialize temporary candlestick V1 source [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
