name: Temporary candlestick V1 backtest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Expand V1 source
        run: |
          base64 --decode candlestick_payload.b64 > /tmp/candlestick-v1.tar.gz
          tar -xzf /tmp/candlestick-v1.tar.gz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          pytest -q

      - name: Backtest 288 UTC windows
        run: |
          candlestick-backtest \
            --symbol BTCUSDT \
            --train-start 2025-01-01 \
            --test-date 2025-12-31 \
            --output-dir reports/2025-12-31

      - uses: actions/upload-artifact@v4
        with:
          name: candlestick-v1-backtest-2025-12-31
          path: reports/2025-12-31

      - name: Commit report to temporary branch
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/2025-12-31
          git commit -m "Temporary candlestick V1 backtest results [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
