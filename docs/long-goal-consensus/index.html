<style>
:root{--bg:#f6f2ea;--card:#fffaf2;--ink:#24211c;--muted:#6d655b;--line:#e1d4c2;--brand:#9b6a3f;--green:#3f6f6a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(circle at top left,#fff4dc,#f6f2ea 42%,#ece4d9);color:var(--ink);line-height:1.6}header{position:sticky;top:0;z-index:10;background:rgba(255,250,242,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.bar{max-width:1180px;margin:auto;padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:22px;margin:0}.sub{font-size:13px;color:var(--muted)}main{max-width:1180px;margin:auto;padding:20px 18px 60px}.notice,.section{background:rgba(255,250,242,.94);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(63,45,25,.1)}.notice{padding:16px;margin-bottom:16px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:16px 0}.tab,button{border:1px solid var(--line);border-radius:999px;background:#fffaf2;color:var(--ink);padding:9px 14px;font-weight:700;cursor:pointer}.tab.active,button.primary{background:var(--ink);border-color:var(--ink);color:#fff}button.green{background:var(--green);border-color:var(--green);color:#fff}.panel{display:none}.panel.active{display:block}.section{margin:18px 0;overflow:hidden}.section h2{margin:0;padding:16px 18px;background:linear-gradient(90deg,rgba(155,106,63,.13),rgba(63,111,106,.08));font-size:19px}.q{border-top:1px solid var(--line);padding:16px 18px}.qtitle{font-size:17px;font-weight:800;margin-bottom:10px}.num{display:inline-flex;min-width:31px;height:26px;align-items:center;justify-content:center;background:#efe2cf;color:#7b5230;border-radius:999px;font-size:13px;margin-right:8px}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;font-size:13px}.box b{display:block;color:var(--brand);margin-bottom:3px}textarea{width:100%;min-height:112px;resize:vertical;border:1px solid #d8cbb8;border-radius:14px;background:#fffdf8;padding:12px 13px;font:inherit;outline:none}textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(155,106,63,.12)}.progress{padding:12px 14px;margin:12px 0 16px;background:#fffaf2;border:1px solid var(--line);border-radius:16px}.track{height:9px;background:#eadfce;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--green));transition:.2s}.small{font-size:12px;color:var(--muted)}.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}.who input{border:1px solid var(--line);border-radius:999px;padding:8px 11px;background:#fffdf8;font:inherit}.compare{overflow:auto}table{border-collapse:collapse;width:100%;background:#fffaf2}th,td{border:1px solid var(--line);padding:10px;vertical-align:top;font-size:13px}th{background:#efe2cf;text-align:left}td{white-space:pre-wrap;min-width:260px}.export{min-height:360px;background:#1f1d1a;color:#fff8e8;border-color:#1f1d1a;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.toast{position:fixed;right:20px;bottom:20px;background:#24211c;color:#fffaf2;padding:11px 14px;border-radius:14px;opacity:0;transform:translateY(8px);transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:820px){.meta{grid-template-columns:1fr}h1{font-size:19px}}

<body>
<header><div class="bar"><div><h1>长期目标共识表｜在线填写版</h1><div class="sub">两人独立填写 → 自动保存 → 共同对照 → 一键复制给 ChatGPT 分析</div></div><div class="actions"><button class="primary" onclick="copyAll()">复制给 ChatGPT</button><button class="green" onclick="downloadMd()">下载 Markdown</button><button onclick="downloadJson()">备份 JSON</button><button onclick="clearAll()">清空</button></div></div></header>
<main>
<div class="notice"><b>使用方法：</b>丈夫和妻子先分别填写自己的页面，不要边写边互相纠正。答案只保存在当前浏览器 localStorage，不会自动上传。填完后点“复制给 ChatGPT”，直接粘贴给我做共同目标分析。换电脑/浏览器前，请先备份 JSON。</div>
<div class="tabs"><button class="tab active" data-tab="husband">丈夫填写</button><button class="tab" data-tab="wife">妻子填写</button><button class="tab" data-tab="compare">共同对照</button><button class="tab" data-tab="export">导出</button></div>
<section id="husband" class="panel active"></section><section id="wife" class="panel"></section><section id="compare" class="panel"></section><section id="export" class="panel"></section>
</main><div id="toast" class="toast">已保存</div>
<script>
const KEY='long_goal_consensus_v2';
const PEOPLE={husband:'丈夫',wife:'妻子'};
const Q=[
['一、我最不想要的未来','五年后，我最不能接受的生活是什么？','想象五年后的你。如果生活还是某种状态，你会痛苦、后悔、压抑。','写出时间、具体状态、为什么不能接受。不要只写“不想穷”。','五年后我们有孩子了，但收入仍完全依赖送外卖，没有稳定存款，没有职业身份，每月担心账单。'],
['一、我最不想要的未来','十年后，如果我还处在什么状态，我会觉得人生很失败？','找出你真正害怕的人生结果。','写出状态，不只写情绪。可涉及收入、家庭、身体、事业、房子、孩子。','十年后仍没有事业、资产和健康节奏，孩子也在焦虑家庭里长大。'],
['一、我最不想要的未来','我最想逃离当前生活背后的哪种感觉？','当前生活不只是送外卖，背后可能是没成长、没身份、没安全感、身体消耗。','至少写 3 个想逃离的感觉，并说明原因。','我想逃离没有增长、每天身体换钱、没有职业身份的感觉。'],
['一、我最不想要的未来','我最不想让未来孩子看到我们处在什么状态？','从父母身份出发，孩子长大后，你不希望 TA 记住怎样的家庭？','写具体家庭画面，不要只写“不想让孩子吃苦”。','不希望孩子看到父母每天为了账单焦虑、互相埋怨、没有时间陪伴。'],
['二、我真正想要的生活','五年后，我理想中的一天是什么样？','从早上写到晚上。不要只写目标，要写生活画面。','包含起床、住处、孩子、工作、收入来源、休息、夫妻相处、结束感受。','早上 7 点起床，孩子去学校。我白天做有积累的工作，晚上陪家人散步，睡前踏实。'],
['二、我真正想要的生活','十年后，我希望我们住在哪里？为什么？','可以写美国、中国、洛杉矶、郊区、学区、靠近家人或事业机会。','不要只写地点，要写原因。','住在洛杉矶附近安全、安静、学区不错的区域，兼顾孩子教育和华人资源。'],
['二、我真正想要的生活','十年后，我希望我们有没有房子？什么样的房子？','买房还是租房？几房？预算范围？自住还是投资？为什么？','至少写是否买房、房子类型、预算范围、买房目的。','希望有 3-4 房自住房，有孩子空间和工作空间，不为了面子过度负债。'],
['二、我真正想要的生活','十年后，我希望我们的家庭年收入是多少？','写真实希望达到的数字。可以写税前或税后，但要注明。','写范围、来源、为什么需要这个数字。不要写“越多越好”。','希望家庭年收入税前 25-30 万美金，来自稳定业务、咨询/产品和投资。'],
['二、我真正想要的生活','十年后，我希望我们的净资产是多少？','净资产=房产权益+现金+投资+生意价值-负债。','写一个范围，并说明为什么这个数字有意义。','希望净资产 100-300 万美金，让家庭有抗风险能力和选择空间。'],
['二、我真正想要的生活','我理想中的家庭氛围是什么样？','写每天想生活在怎样的家庭里：安稳、自由、有秩序、温暖、成长。','至少写 5 个关键词，并解释最重要的 1-2 个。','温暖、稳定、有秩序、成长、自由。最重要的是稳定和成长。'],
['三、我真正看重什么','我最看重的前 5 个东西是什么？请排序。','可选：财富增长、时间自由、家庭稳定、身体健康、孩子教育、精神平静、事业成就、职业身份等。','必须排序，每个选择后写为什么。','1 家庭稳定：孩子出生后不能一直动荡；2 财富增长：没有钱很多选择都没有。'],
['三、我真正看重什么','如果只能先牺牲其中一个，我最不能牺牲什么？','比如健康、孩子陪伴、基本安全感、夫妻关系、长期成长、自由、收入。','写出一个最不能牺牲的东西，并说明为什么。','我最不能牺牲身体健康，因为没有健康，事业和家庭都无法持续。'],
['四、我愿意付出的代价','为了五年后的理想生活，我愿意牺牲什么？','目标一定有代价。写愿意暂时牺牲什么：娱乐、消费、短期收入、面子、自由时间。','不要写“努力”。写具体牺牲、持续多久、为什么值得。','愿意接受 12-18 个月低收入学习期，每周投入 15 小时，只要能进入有成长行业。'],
['四、我愿意付出的代价','我愿意接受多久的低收入转型期？','转型不会立刻赚钱。你能接受 3 个月、6 个月、1 年、2 年？','写时间长度、最低现金流要求、为什么能接受。','能接受 6-12 个月低收入转型，但家庭每月至少保证基本开销和应急金。'],
['四、我愿意付出的代价','我每天/每周愿意投入多少时间建设未来？','不要写“有空就学”。要写固定投入。','写每周小时数、安排在哪几天、投入什么事情。','每周至少 10 小时，分成 5 天，用来学习、做内容、整理职业路径。'],
['四、我愿意付出的代价','哪些痛苦我愿意承受，因为它能带我去更好的地方？','比如学习困难、前期收入低、被误解、短期没成果、考试、找工作、做内容。','至少写 3 个愿意承受的痛苦。','愿意承受前期收入低、学习吃力、短期无成果，因为这些能换来新能力和身份。'],
['五、我绝对不愿意付出的代价','我绝对不愿意牺牲什么？','这决定职业边界：身体、孩子陪伴、不高负债、不长期异地、不完全没时间。','至少写 3 条不可接受的代价。','不牺牲身体健康；不为了创业高额负债；不接受孩子出生后完全没有陪伴。'],
['五、我绝对不愿意付出的代价','我不能接受的工作方式是什么？','比如长期纯体力、强销售、固定被困、无成长、大量社交、高压竞争。','写出工作方式和为什么不适合你。','不能接受长期纯体力且无成长的工作，因为它只消耗时间和身体。'],
['五、我绝对不愿意付出的代价','我不能接受的财务风险是什么？','比如高额借贷、一次性投入太大、没现金流、没存款就创业、怀孕期间断收入。','写出能接受和不能接受的财务边界。','能接受几百到几千美金试错，不能接受没存款就借大钱开店。'],
['六、我的事业/职业方向判断','一个适合我的职业/事业，必须满足哪些条件？','不要只看赚钱。可写能积累、适合带娃、有身份、有成长、可线上化、不靠纯体力。','至少写 5 条条件，并排序。','有长期积累、不完全靠体力、和家庭阶段兼容、有职业身份、未来能产品化。'],
['六、我的事业/职业方向判断','我最不适合什么类型的工作？','从性格、身体、家庭阶段、能力出发，不是别人说不好，而是你真的不适合。','写 3 类不适合的工作，并说明原因。','不适合长期高压销售，因为我不喜欢强推别人；也不适合长期纯体力。'],
['六、我的事业/职业方向判断','我未来最想积累哪三种能力？','比如教育专业、AI/技术、销售、内容表达、管理、英文沟通、育儿知识、运营。','每个能力后写为什么值得积累。','教育专业形成身份；内容表达形成影响力；客户服务转成咨询收入。'],
['六、我的事业/职业方向判断','我希望未来靠什么获得收入？','可多选：工资、咨询、课程、服务、内容、产品、生意、投资、房产、AI 工具。','写主要收入、次要收入、不希望长期依赖的收入方式。','主要靠教育服务/咨询，次要靠内容产品和投资，不长期依赖送外卖。'],
['六、我的事业/职业方向判断','如果我继续现在的生活五年，最大的代价是什么？','写真实代价：时间、身体、技能、身份、孩子、存款、机会。','至少写 3 种具体代价。','没有新能力、身体继续消耗、孩子出生后家庭仍没有稳定上升路径。'],
['七、当前候选路径判断','对我来说，“幼教/教育行业”真正吸引我的是什么？','不是别人学所以我也学。写自己被吸引的地方：孩子、稳定、身份、妈妈身份、美国教育等。','至少写 3 个真实吸引点。','它和妈妈身份有关；能离开送外卖；未来可能服务华人家庭。'],
['七、当前候选路径判断','我担心“幼教/教育行业”的地方是什么？','写真实担心：收入低、太累、被固定、感染风险、怀孕不适合、英文压力、天花板低。','至少写 3 个担心，并标注严重程度 1-10。','担心收入低 8/10；担心身体累 7/10；担心被固定 6/10。'],
['七、当前候选路径判断','如果选择幼教，它应该是终点，还是跳板？','终点=长期当老师；跳板=先进教育行业，再延伸到咨询、内容、课程、游学等。','说明你的选择和原因。','我希望它是跳板，先拿经验和身份，未来做华人家庭低龄教育内容/咨询。'],
['七、当前候选路径判断','除了幼教，我还有哪些可能路径？','列至少 3 个候选方向：教育咨询、AI 辅助事业、房地产、护理、会计、内容、电商等。','每个方向写可能适合/不适合的原因。','房地产可能适合因为有证书路径；不适合因为需要强销售且收入不稳定。'],
['八、我们家庭的共同目标','未来一年，我们必须解决什么？','一年目标要现实：减少送外卖依赖、怀孕/生产安排、基础存款、学习路径、可增长方向。','写 3 个必须解决的问题，并按优先级排序。','建立基础现金流和存款；妻子验证教育路径；丈夫建立非送外卖现金流实验。'],
['八、我们家庭的共同目标','未来三年，我们要建立什么？','三年是建设期：职业身份、小生意、孩子出生后的家庭节奏、存款、信用、证书、案例。','写 3-5 个建设目标。','稳定家庭节奏、非送外卖收入主线、教育经验/证书、基础存款和信用。'],
['八、我们家庭的共同目标','未来五年，我们希望达到什么状态？','五年目标要有画面和数字：收入、住处、孩子、事业、身体、存款、工作方式。','至少包含 3 个数字或可判断状态。','不再依赖送外卖，年收入达到 X，孩子生活稳定，有 X 个月应急金。'],
['八、我们家庭的共同目标','未来十年，我们想过什么样的生活？','长期愿景。写真正期待的生活，不要只写钱。','包含家庭、事业、钱、房子、孩子、身体、内心状态。','有房、有稳定事业、孩子教育清楚、身体健康，不再被短期现金流支配。'],
['九、我希望伴侣如何支持我','我希望伴侣怎么支持我？','写具体行为：查信息、不要急着否定、做表格、复盘、提醒、尊重节奏。','不要只写“理解我”，要写具体动作。','我提出模糊想法时，希望先帮我整理选项，而不是马上判断好不好。'],
['九、我希望伴侣如何支持我','我不希望伴侣怎么对待我？','写最容易被触发的方式：被命令、否定、催、比较、贴标签、冷处理、说没主见。','写具体行为和它带给你的感受。','不希望被说没有主见，因为我会感觉整个人被否定。'],
['九、我希望伴侣如何支持我','当我迷茫时，我希望伴侣做什么？','迷茫时你需要建议、陪伴、安静、具体计划、现实分析、情绪接住还是推动？','写出真正需要的支持方式。','我希望先被听完，再一起整理选项，而不是立刻被推进一个决定。'],
['九、我希望伴侣如何支持我','我希望我们两个人未来分别承担什么角色？','家庭系统里不一定做一样的事：一个探索事业，一个稳定职业；一个技术系统，一个教育内容。','写你适合承担什么、希望对方承担什么、共同承担什么。','我适合教育和内容体验；对方适合技术和系统；共同承担家庭现金流和孩子教育。'],
['十、最终总结','写完这份表后，我发现我真正想要的是：','用自己的话总结，不要复制前面答案。','写出一个核心方向，而不是很多散乱愿望。','我真正想要的是稳定、有成长、有家庭感的生活，而不是每天靠体力换钱。'],
['十、最终总结','我发现我真正害怕的是：','写内心深处的担心：失败、被困住、没钱、孩子受影响、被控制、选错路。','写出恐惧和为什么它重要。','我害怕孩子出生后我们还是没有方向，这会让我觉得没有承担好父母责任。'],
['十、最终总结','我发现我目前最值得尝试的方向是：','不是终身决定，只是当前最值得验证的方向。','写出方向和为什么值得先试。','目前最值得尝试幼教/ECE，因为它和妈妈身份、教育行业、离开送外卖有关。'],
['十、最终总结','接下来 90 天，我愿意做的一个低成本实验是：','不要写大目标。写一个可以开始的小实验：上一门课、访谈、做内容、申请工作等。','必须包含做什么、多久、每周投入、判断标准、失败如何退出。','90 天上一门 ECE 课，每周 6 小时，访谈 3 个从业者，做 10 条中文笔记。']
];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{husband:{},wife:{},meta:{}}}catch(e){return{husband:{},wife:{},meta:{}}}}
function save(d){d.meta=d.meta||{};d.meta.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(d));}
function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function items(){return Q.map((x,i)=>({id:'q'+(i+1),n:i+1,sec:x[0],title:x[1],hint:x[2],std:x[3],ex:x[4]}))}
function ans(p,id){return load()[p]?.[id]||''}
function setAns(p,id,v){const d=load();d[p]=d[p]||{};d[p][id]=v;save(d);progress(p)}
function name(p){const d=load();return d.meta?.[p+'Name']||PEOPLE[p]}
function setName(p,v){const d=load();d.meta=d.meta||{};d.meta[p+'Name']=v||PEOPLE[p];save(d);renderCompare();}
function comp(p){const all=items(),filled=all.filter(q=>(ans(p,q.id)||'').trim().length>=8).length;return{filled,total:all.length,pct:Math.round(filled/all.length*100)}}
function progress(p){const c=comp(p),t=document.getElementById(p+'progtext'),f=document.getElementById(p+'fill');if(t)t.textContent=`已填写 ${c.filled}/${c.total} 题（${c.pct}%）。8 个字以上才算已填写。`;if(f)f.style.width=c.pct+'%'}
function renderPerson(p){let html=`<div class='who'><h2>${PEOPLE[p]}版</h2><label>填写人：<input value='${esc(name(p))}' oninput='setName("${p}",this.value)'></label></div><div class='progress'><b>填写进度</b><div id='${p}progtext' class='small'></div><div class='track'><div id='${p}fill' class='fill'></div></div></div>`;let sec='';items().forEach(q=>{if(q.sec!==sec){if(sec)html+='</div>';sec=q.sec;html+=`<div class='section'><h2>${esc(sec)}</h2>`}html+=`<div class='q'><div class='qtitle'><span class='num'>${q.n}</span>${esc(q.title)}</div><div class='meta'><div class='box'><b>题目提示</b>${esc(q.hint)}</div><div class='box'><b>填写标准</b>${esc(q.std)}</div><div class='box'><b>合格示例</b>${esc(q.ex)}</div></div><textarea placeholder='在这里填写真实答案……' oninput='setAns("${p}","${q.id}",this.value);charCount(this)'>${esc(ans(p,q.id))}</textarea><div class='small'><span class='count'>0 字</span> · 建议至少 2-5 句话，关键题可以写更长。</div></div>`});html+='</div>';document.getElementById(p).innerHTML=html;document.querySelectorAll(`#${p} textarea`).forEach(charCount);progress(p)}
function charCount(t){const n=[...t.value.trim()].length;const c=t.parentElement.querySelector('.count');if(c)c.textContent=n+' 字'}
function switchTab(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));if(id==='compare')renderCompare();if(id==='export')renderExport();scrollTo({top:0,behavior:'smooth'}) }
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function renderCompare(){let h=`<div class='notice'><b>共同对照：</b>这里不是判断谁对谁错，而是看目标哪里一致、哪里冲突、哪里可以分阶段兼容。</div><div class='compare'><table><thead><tr><th>题目</th><th>${esc(name('husband'))}</th><th>${esc(name('wife'))}</th></tr></thead><tbody>`;items().forEach(q=>h+=`<tr><th>${q.n}. ${esc(q.title)}<br><span class='small'>${esc(q.sec)}</span></th><td>${esc(ans('husband',q.id)||'未填写')}</td><td>${esc(ans('wife',q.id)||'未填写')}</td></tr>`);h+='</tbody></table></div>';document.getElementById('compare').innerHTML=h}
function markdown(){const d=load();let m=`# 长期目标共识表填写结果\n\n导出时间：${new Date().toLocaleString()}\n\n`;['husband','wife'].forEach(p=>{m+=`\n---\n\n# ${name(p)}（${PEOPLE[p]}版）\n`;let sec='';items().forEach(q=>{if(q.sec!==sec){sec=q.sec;m+=`\n## ${sec}\n`}m+=`\n### ${q.n}. ${q.title}\n${(ans(p,q.id)||'未填写').trim()}\n`})});m+='\n---\n\n# 请 ChatGPT 分析\n请根据以上两份答案分析：一致处、真实冲突、可兼容部分、1/3/5/10 年共同路线，以及每个人更适合承担的家庭/事业角色。\n';return m}
async function copyAll(){const m=markdown();try{await navigator.clipboard.writeText(m);show('已复制，可以粘贴给 ChatGPT')}catch(e){renderExport();document.getElementById('out').select();show('请手动 Ctrl+C')}}
function renderExport(){document.getElementById('export').innerHTML=`<div class='notice'><b>导出：</b>复制下面内容发给 ChatGPT，或下载保存。</div><textarea id='out' class='export'>${esc(markdown())}</textarea><p><button class='primary' onclick='copyAll()'>复制给 ChatGPT</button> <button class='green' onclick='downloadMd()'>下载 Markdown</button> <button onclick='downloadJson()'>备份 JSON</button></p>`}
function dl(file,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function downloadMd(){dl('长期目标共识表_填写结果.md',markdown(),'text/markdown;charset=utf-8');show('已下载 Markdown')}
function downloadJson(){dl('长期目标共识表_备份.json',JSON.stringify(load(),null,2),'application/json;charset=utf-8');show('已下载 JSON')}
function clearAll(){if(confirm('确定清空所有答案吗？建议先备份 JSON。')){localStorage.removeItem(KEY);init();show('已清空')}}
function show(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function init(){renderPerson('husband');renderPerson('wife');renderCompare();renderExport()}init();
</script>
</body>
</html>
